# Sanitizer tests (ASan+UBSan / TSan)
# Trigger: push/PR to main (including changes to workflow itself—.github/** not ignored,
# Workflow changes require syntax and logic verification), or manual workflow_dispatch
# Changes to non-code files such as documentation do not trigger tests (sanitizer is most expensive job; rerunning all tests
# after README changes is wasteful). ASan+UBSan catches out-of-bounds access/UB: run full tests with Debug + sanitizer,
# then another race stress round (race paths most likely to cause memory errors). TSan and ASan runtimes mutually exclusive,
# requiring separate jobs: first two full rounds (TSan detects dynamically; races must involve genuinely concurrent threads
# to trigger detection; two rounds increase scheduling coverage), then concurrency-focused stress (30 repetitions). Run only on
# Linux (UBSan/TSan support incomplete on Windows); static library avoids runtime-loading problems with shared +
# sanitizer. TSan encounters "unexpected memory mapping" on kernels 6.8+ (mmap_rnd_bits=32)
# (unsupported by GCC libtsan); CI uses clang and
# setarch -R to disable ASLR as fallback (verified locally in WSL)

name: Sanitizer (ASan + UBSan + TSan)

on:
  push:
    branches: [ "main" ]
    # Changes to non-code files such as documentation do not trigger tests
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasio-dev libspdlog-dev libgtest-dev libcxxopts-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DUSBIPDCPP_USE_PKGCONF_ASIO=ON \
            -DUSBIPDCPP_BUILD_SHARED_LIBS=OFF \
            -DUSBIPDCPP_BUILD_VIRTUAL_DEVICE=ON \
            -DUSBIPDCPP_BUILD_LIBUSB_COMPONENTS=OFF \
            -DUSBIPDCPP_BUILD_EXAMPLES=ON \
            -DUSBIPDCPP_BUILD_TESTS=ON \
            -S ${{ github.workspace }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      # Race paths most likely to cause memory errors: run another connection/stop race stress round under ASan
      - name: Stress test (TestNetworkConnection)
        shell: bash
        working-directory: build
        run: |
          ctest --repeat until-fail:30 --timeout 120 --output-on-failure \
            -R "TestNetworkConnection\.(ServerCanRestartAfterStop|StopWithMultipleClients|StopDuringClientConnectRace)"

  # TSan: separate job (runtime mutually exclusive with ASan). First two full rounds (a single round may happen to be scheduled
  # serially and miss races), then concurrency-focused stress—connection/stop races, virtual-device transfers,
  # pipe devices, transfer scheduler are concurrency priorities. setarch -R disables ASLR: kernel mmap
  # mapping fails for TSan when randomization bit count too high (see header comment)
  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasio-dev libspdlog-dev libgtest-dev libcxxopts-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread" \
            -DUSBIPDCPP_USE_PKGCONF_ASIO=ON \
            -DUSBIPDCPP_BUILD_SHARED_LIBS=OFF \
            -DUSBIPDCPP_BUILD_VIRTUAL_DEVICE=ON \
            -DUSBIPDCPP_BUILD_LIBUSB_COMPONENTS=OFF \
            -DUSBIPDCPP_BUILD_EXAMPLES=OFF \
            -DUSBIPDCPP_BUILD_TESTS=ON \
            -S ${{ github.workspace }}

      - name: Build
        run: cmake --build build --parallel

      # First two full TSan rounds: dynamic detection reports only genuinely concurrent threads; a single round may be scheduled
      # serially, missing races; two rounds improve coverage
      - name: Test (full, 2 rounds)
        shell: bash
        working-directory: build
        run: |
          setarch $(uname -m) -R ctest --repeat until-fail:2 --timeout 120 --output-on-failure

      # TSan detects dynamically, reporting races only when two threads access concurrently—a single run may happen to be scheduled
      # serially and miss races; repeat 30 rounds to improve scheduling coverage (TSan is slow; this is the practical limit)
      - name: Test (concurrency-focused)
        shell: bash
        working-directory: build
        run: |
          setarch $(uname -m) -R ctest --repeat until-fail:30 --timeout 120 --output-on-failure \
            -R "TestNetworkConnection\.|TestNetworkVdev\.|TestPipeDeviceHandler\.|TransferSchedulerTest\."
