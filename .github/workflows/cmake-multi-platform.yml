# Multiplatform CMake build + tests
# Trigger: push/PR to main, or manual workflow_dispatch
# Matrix: Linux(gcc) 8 × macOS(clang) 8 × Windows(msvc) 4 option combinations

name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
    # Changes to non-code files such as documentation do not trigger a build
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # ======== Linux (gcc): all VIRTUAL_DEVICE × LIBUSB × SHARED combinations (8) ========
          - { name: linux-gcc  vdev+libusb+shared, os: ubuntu-24.04, cpp: g++,    vdev: ON,  libusb: ON,  shared: ON }
          - { name: linux-gcc  vdev+libusb static,  os: ubuntu-24.04, cpp: g++,    vdev: ON,  libusb: ON,  shared: OFF }
          - { name: linux-gcc  vdev shared,         os: ubuntu-24.04, cpp: g++,    vdev: ON,  libusb: OFF, shared: ON }
          - { name: linux-gcc  vdev static,         os: ubuntu-24.04, cpp: g++,    vdev: ON,  libusb: OFF, shared: OFF }
          - { name: linux-gcc  libusb+shared,       os: ubuntu-24.04, cpp: g++,    vdev: OFF, libusb: ON,  shared: ON }
          - { name: linux-gcc  libusb static,       os: ubuntu-24.04, cpp: g++,    vdev: OFF, libusb: ON,  shared: OFF }
          - { name: linux-gcc  shared only,         os: ubuntu-24.04, cpp: g++,    vdev: OFF, libusb: OFF, shared: ON }
          - { name: linux-gcc  static only,         os: ubuntu-24.04, cpp: g++,    vdev: OFF, libusb: OFF, shared: OFF }
          # ======== macOS (clang): all VIRTUAL_DEVICE × LIBUSB × SHARED combinations (8) ========
          - { name: macos-clang  vdev+libusb+shared, os: macos-latest, cpp: clang++, vdev: ON,  libusb: ON,  shared: ON }
          - { name: macos-clang  vdev+libusb static,  os: macos-latest, cpp: clang++, vdev: ON,  libusb: ON,  shared: OFF }
          - { name: macos-clang  vdev shared,         os: macos-latest, cpp: clang++, vdev: ON,  libusb: OFF, shared: ON }
          - { name: macos-clang  vdev static,         os: macos-latest, cpp: clang++, vdev: ON,  libusb: OFF, shared: OFF }
          - { name: macos-clang  libusb+shared,       os: macos-latest, cpp: clang++, vdev: OFF, libusb: ON,  shared: ON }
          - { name: macos-clang  libusb static,       os: macos-latest, cpp: clang++, vdev: OFF, libusb: ON,  shared: OFF }
          - { name: macos-clang  shared only,         os: macos-latest, cpp: clang++, vdev: OFF, libusb: OFF, shared: ON }
          - { name: macos-clang  static only,         os: macos-latest, cpp: clang++, vdev: OFF, libusb: OFF, shared: OFF }
          # ======== Windows (msvc): VIRTUAL_DEVICE × SHARED (libusb is not enabled, runner does not have libusb) (4) ========
          - { name: win-msvc  vdev+shared,          os: windows-latest, cpp: cl,    vdev: ON,  libusb: OFF, shared: ON }
          - { name: win-msvc  vdev static,          os: windows-latest, cpp: cl,    vdev: ON,  libusb: OFF, shared: OFF }
          - { name: win-msvc  shared only,          os: windows-latest, cpp: cl,    vdev: OFF, libusb: OFF, shared: ON }
          - { name: win-msvc  static only,          os: windows-latest, cpp: cl,    vdev: OFF, libusb: OFF, shared: OFF }

    steps:
      - uses: actions/checkout@v4

      # ======== Dependencies ========

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasio-dev libspdlog-dev libgtest-dev libcxxopts-dev libevdev-dev libminiaudio-dev
          if [ "${{ matrix.libusb }}" = "ON" ]; then
            sudo apt-get install -y libusb-1.0-0-dev
          fi

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install asio spdlog gtest cxxopts miniaudio --triplet x64-windows

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install asio spdlog libusb cxxopts googletest miniaudio

      # ======== CMake configuration ========

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSBIPDCPP_USE_PKGCONF_ASIO=ON \
            -DUSBIPDCPP_BUILD_EXAMPLES=ON \
            -DUSBIPDCPP_BUILD_TESTS=ON \
            -DUSBIPDCPP_BUILD_VIRTUAL_DEVICE=${{ matrix.vdev }} \
            -DUSBIPDCPP_BUILD_LIBUSB_COMPONENTS=${{ matrix.libusb }} \
            -DUSBIPDCPP_BUILD_SHARED_LIBS=${{ matrix.shared }} \
            -S ${{ github.workspace }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DUSBIPDCPP_BUILD_EXAMPLES=ON `
            -DUSBIPDCPP_BUILD_TESTS=ON `
            -DUSBIPDCPP_BUILD_VIRTUAL_DEVICE=${{ matrix.vdev }} `
            -DUSBIPDCPP_BUILD_LIBUSB_COMPONENTS=${{ matrix.libusb }} `
            -DUSBIPDCPP_BUILD_SHARED_LIBS=${{ matrix.shared }} `
            -S ${{ github.workspace }}

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DUSBIPDCPP_USE_PKGCONF_ASIO=ON \
            -DUSBIPDCPP_BUILD_EXAMPLES=ON \
            -DUSBIPDCPP_BUILD_TESTS=ON \
            -DUSBIPDCPP_BUILD_VIRTUAL_DEVICE=${{ matrix.vdev }} \
            -DUSBIPDCPP_BUILD_LIBUSB_COMPONENTS=${{ matrix.libusb }} \
            -DUSBIPDCPP_BUILD_SHARED_LIBS=${{ matrix.shared }} \
            -S ${{ github.workspace }}

      # ======== Compile + Test ========

      # ubuntu-24.04 runner has only 2 cores and little memory: with 2 concurrent compilations, large headers such as miniaudio/fmt
      # expand simultaneously, exceeding the peak memory limit; the kernel OOM killer kills cc1plus (observed g++: fatal
      # error: Killed; memory pressure also kills the runner service, exit 143); limit Linux to 1 concurrent compilation
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config Release --parallel 1

      # Windows/macOS compilers use less memory; do not limit parallelism (use all runner cores)
      - name: Build
        if: runner.os != 'Linux'
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest --build-config Release --output-on-failure

      # ======== Frequently repeated stability tests ========
      # Intermittent bugs in thread races, stop sequences, etc. cannot be exposed by a single run (a local race once hung only on the 1303rd
      # iteration), so repeat lifecycle paths with previous bugs for 50 rounds, stopping on failure.
      # TestNetworkConnection contains connection/stop/race tests (separate file from pure data-structure
      # tests); StopDuringClientConnectRace is the only test with incoming connections
      # at stop time, directly covering the race between acceptor close and accept (root cause of this CI
      # crash). Retain it despite taking about 2 seconds per run on Windows (thread/socket overhead).
      # Must use shell: bash: trailing \ for line continuation is bash syntax; the Windows runner's default
      # pwsh treats it as a literal argument, losing the -R filter and repeating all tests for 50 rounds (once
      # made the Windows job run for 50 minutes)
      - name: Stress test (TestNetworkConnection)
        shell: bash
        working-directory: build
        run: |
          # tee retains live log output; on failure, symbolize crash stack directly on runner
          # (binaries still available; tools/addr2line_crash.sh parses offsets in logs),
          # otherwise addresses can never be resolved after leaving runner
          set +e
          ctest --build-config Release --repeat until-fail:50 --timeout 120 --output-on-failure \
            -R "TestNetworkConnection\.(ServerCanRestartAfterStop|ManyQuickConnections|StopWithMultipleClients|StopDuringClientConnectRace)" \
            2>&1 | tee /tmp/stress.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
              echo "=== Symbolizing the crash stack ==="
              bash ${{ github.workspace }}/tools/addr2line_crash.sh /tmp/stress.log || true
              exit $status
          fi

      - name: Stress test (TestNetworkVdev)
        if: matrix.vdev == 'ON'
        shell: bash
        working-directory: build
        run: |
          set +e
          ctest --build-config Release --repeat until-fail:50 --timeout 120 --output-on-failure \
            -R "TestNetworkVdev\.(ServerCanStopWithImportedDevice|ClientDisconnectsDuringUrbTransfer)" \
            2>&1 | tee /tmp/stress_vdev.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
              echo "=== Symbolizing the crash stack ==="
              bash ${{ github.workspace }}/tools/addr2line_crash.sh /tmp/stress_vdev.log || true
              exit $status
          fi

  # Termux (Android) compilation verification.
  # Termux rootfs has no glibc; actions' node programs (including actions/checkout) cannot run inside container,
  # so checkout runs on host; mount source into termux-docker image for building.
  # Image entrypoint switches automatically from root to container user (1000) (pkg rejects root);
  # mounted workspace belongs to host runner (1001), so container user cannot write it;
  # place build directory in container HOME; workspace supplies read-only source only.
  # cxxopts is absent from Termux repository; install manually following README (its tests depend on Android system library
  # liblog, but image has no Android runtime, so disable tests); miniaudio is also absent,
  # automatically disabling mock_audio's --audio option (AudioFileSource).
  termux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in Termux container
        run: |
          cat > /tmp/termux_ci.sh <<'EOF'
          #!/bin/bash
          set -e
          pkg update -y
          # Explicitly install libc++: Termux libc++ headers come from ndk-sysroot, runtime library
          # from libc++ package; upgrading ndk-sysroot without libc++ makes versions mismatch (once
          # ndk-sysroot 30 paired with libc++ 29 caused undefined std::__ndk1::__hash_memory at link time);
          # explicit installation keeps it at same version as ndk-sysroot
          pkg install -y bash git clang cmake ninja pkg-config libasio libspdlog googletest libusb libc++
          git clone --depth 1 https://github.com/jarro2783/cxxopts.git ~/cxxopts
          cd ~/cxxopts
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCXXOPTS_BUILD_TESTS=OFF -DCXXOPTS_BUILD_EXAMPLES=OFF \
              -DCMAKE_INSTALL_PREFIX="$PREFIX/opt/cxxopts"
          cmake --build build
          cmake --install build
          cd /src
          cmake -B ~/build-usbipdcpp -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DUSBIPDCPP_USE_PKGCONF_ASIO=ON \
              -Dcxxopts_DIR="$PREFIX/opt/cxxopts/share/cmake/cxxopts" \
              -DUSBIPDCPP_BUILD_EXAMPLES=ON \
              -DUSBIPDCPP_BUILD_TESTS=ON \
              -DUSBIPDCPP_BUILD_VIRTUAL_DEVICE=ON \
              -DUSBIPDCPP_BUILD_LIBUSB_COMPONENTS=ON
          cmake --build ~/build-usbipdcpp
          cd ~/build-usbipdcpp && ctest
          EOF
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v /tmp/termux_ci.sh:/ci.sh \
            termux/termux-docker:latest \
            bash /ci.sh
