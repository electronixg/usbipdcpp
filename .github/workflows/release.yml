# Publish precompiled binaries to GitHub Release
# Trigger: push v* tag (e.g. v1.0.4)
# Output: linux-x64 / linux-aarch64 / macos-arm64 / win-x64 shared-library tar.gz packages

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Release after build completion (tag triggers always publish; manual triggers default to no publication; download output from artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,      os: ubuntu-24.04 }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm }
          - { name: macos-arm64,    os: macos-latest }
          - { name: win-x64,        os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      # ======== Dependencies ========

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasio-dev libspdlog-dev libusb-1.0-0-dev libcxxopts-dev libevdev-dev libavformat-dev libavcodec-dev libswscale-dev libavutil-dev libgtest-dev libminiaudio-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install asio spdlog libusb cxxopts ffmpeg googletest miniaudio

      - name: Setup FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
          Write-Host "=== Downloading: $ffmpegUrl ==="
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip
          Write-Host "=== Extracting ==="
          Expand-Archive -Path ffmpeg.zip -DestinationPath .
          $ffmpegDir = Get-ChildItem -Directory -Name "ffmpeg-*" | Select-Object -First 1
          if (-not $ffmpegDir) { Write-Error "ffmpeg extraction failed"; exit 1 }
          $ffmpegPath = (Resolve-Path $ffmpegDir).ToString().Replace('\', '/')
          Write-Host "FFMPEG_DIR=$ffmpegPath"
          Write-Host "=== Contents of lib/pkgconfig ==="
          Get-ChildItem "$ffmpegDir/lib/pkgconfig/"
          Write-Host "=== Setting env vars ==="
          "FFMPEG_DIR=$ffmpegPath" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$ffmpegPath/lib/pkgconfig" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools\pkgconf" >> $env:GITHUB_PATH

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install asio spdlog libusb cxxopts pkgconf gtest miniaudio --triplet x64-windows

      # ======== CMake configuration ========

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSBIPDCPP_USE_PKGCONF_ASIO=ON \
            -DUSBIPDCPP_BUILD_SHARED_LIBS=ON \
            -DUSBIPDCPP_BUILD_VIRTUAL_DEVICE=ON \
            -DUSBIPDCPP_BUILD_LIBUSB_COMPONENTS=ON \
            -DUSBIPDCPP_BUILD_EXAMPLES=ON \
            -DUSBIPDCPP_INSTALL_EXAMPLES=ON \
            -DUSBIPDCPP_BUILD_TESTS=ON \
            -S ${{ github.workspace }}

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DUSBIPDCPP_USE_PKGCONF_ASIO=ON \
            -DUSBIPDCPP_BUILD_SHARED_LIBS=ON \
            -DUSBIPDCPP_BUILD_VIRTUAL_DEVICE=ON \
            -DUSBIPDCPP_BUILD_LIBUSB_COMPONENTS=ON \
            -DUSBIPDCPP_BUILD_EXAMPLES=ON \
            -DUSBIPDCPP_INSTALL_EXAMPLES=ON \
            -DUSBIPDCPP_BUILD_TESTS=ON \
            -S ${{ github.workspace }}

      - name: Debug pkg-config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH"
          Write-Host "PATH pkgconf check:"
          Get-Command pkgconf -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          Get-Command pkg-config -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          Write-Host "pkgconf search path:"
          pkgconf --variable pc_path pkg-config 2>$null
          Write-Host "Testing libavcodec:"
          pkgconf --modversion libavcodec 2>&1

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DUSBIPDCPP_BUILD_SHARED_LIBS=ON `
            -DUSBIPDCPP_BUILD_VIRTUAL_DEVICE=ON `
            -DUSBIPDCPP_BUILD_LIBUSB_COMPONENTS=ON `
            -DUSBIPDCPP_BUILD_EXAMPLES=ON `
            -DUSBIPDCPP_INSTALL_EXAMPLES=ON `
            -DUSBIPDCPP_BUILD_TESTS=ON `
            -S ${{ github.workspace }}

      # ======== Build + test + install ========

      # The ubuntu runner has only 2 cores and little memory: during parallel compilation, large headers such as miniaudio/fmt
      # are expanded simultaneously, exceeding the peak memory limit and triggering the kernel OOM killer (observed in practice: g++: fatal error: Killed +
      # exit 143, for the same reason as in cmake-multi-platform.yml); limit Linux to 1 concurrent compilation
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config Release --parallel 1

      # macOS/Windows compilers use less memory; do not limit parallelism (use all runner cores)
      - name: Build
        if: runner.os != 'Linux'
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest --build-config Release

      - name: Install & package
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          DIRNAME="usbipdcpp-${VERSION}-${{ matrix.name }}"
          cmake --install build --config Release --prefix "${DIRNAME}"
          # Copy the BtbN ffmpeg DLLs to the installation directory (Windows)
          [ -n "$FFMPEG_DIR" ] && cp "$FFMPEG_DIR"/bin/*.dll "${DIRNAME}/bin/"
          tar czf "${DIRNAME}.tar.gz" "${DIRNAME}"
          echo "archive=${DIRNAME}.tar.gz" >> $GITHUB_ENV

      - name: Verify installed DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          DIRNAME="usbipdcpp-${VERSION}-${{ matrix.name }}"

          # Download wldd (the Windows equivalent of ldd)
          curl -sL "https://github.com/marcoesposito1988/dependency_runner/releases/download/v1.5.0/wldd-x86_64-pc-windows-msvc.zip" -o wldd.zip
          unzip -q wldd.zip

          # Verify that every DLL and exe in the installation directory has all its dependencies
          echo "=== Checking installed DLLs for complete dependencies ==="
          find "${DIRNAME}/bin" -type f \( -name "*.dll" -o -name "*.exe" \) -print0 > /tmp/files.txt
          while IFS= read -r -d '' file; do
            echo "--- $(basename "$file") ---"
            ./wldd.exe "$file" 2>&1
          done < /tmp/files.txt > /tmp/wldd_out.txt
          if grep -qiE "(not found|missing|could not)" /tmp/wldd_out.txt; then
            echo "There is an unresolved DLL dependency!"
            grep -iE "(not found|missing|could not)" /tmp/wldd_out.txt
            exit 1
          fi
          echo "All DLL dependencies passed verification"

      # ======== Upload artifacts (publish to the Release together after all platforms finish building) ========

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.archive }}
          if-no-files-found: error

  # Wait for all platforms to succeed, then upload all artifacts to the Release together.
  # Tag triggers (push) always publish; manual triggers are controlled by the publish input (no publication by default)
  release-upload:
    needs: [ release ]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
          # Publish as pre-release by default; convert to stable release after manual verification
          prerelease: true